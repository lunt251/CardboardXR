name: Build Android APK

# NOT USABLE WITH UNITY PERSONAL. Unity's licence server gives Personal accounts no headless (batch-mode)
# entitlement, so the editor refuses to start here ("com.unity.editor.headless was not found"). This only
# works with a paid Unity serial (UNITY_SERIAL, UNITY_EMAIL, UNITY_PASSWORD). With Personal, use Unity Build
# Automation instead, with ProjectBootstrap.StereoBuilder.PreExport as the target's pre-export method.

on:
  workflow_dispatch:

env:
  UNITY_IMAGE: unityci/editor:ubuntu-6000.6.0f1-android-3.2.2
  # A different app id from the published app, so this build installs next to it instead of failing on
  # a signature mismatch (CI signs with Unity's debug key).
  CARDBOARDXR_BUNDLE_ID: com.cardboardxr.drawing

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space for the Unity image
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /usr/local/lib/android "$AGENT_TOOLSDIRECTORY"
          df -h /

      - uses: actions/cache@v4
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/packages-lock.json', 'ProjectSettings/ProjectVersion.txt') }}
          restore-keys: Library-Android-

      - name: Pull the Unity image
        run: docker pull "$UNITY_IMAGE"

      - name: Install the Unity licence
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          test -n "$UNITY_LICENSE" || { echo "::error::The UNITY_LICENSE secret isn't set"; exit 1; }
          mkdir -p "$HOME/.local/share/unity3d/Unity"
          printf '%s' "$UNITY_LICENSE" > "$HOME/.local/share/unity3d/Unity/Unity_lic.ulf"

      - name: Build the APK
        run: |
          docker run --rm \
            -e CARDBOARDXR_BUNDLE_ID \
            -v "$GITHUB_WORKSPACE":/project \
            -v "$HOME/.local/share/unity3d":/root/.local/share/unity3d \
            -w /project \
            "$UNITY_IMAGE" \
            unity-editor -batchmode -nographics -projectPath /project -buildTarget Android \
              -executeMethod ProjectBootstrap.StereoBuilder.BuildAndroid -logFile /project/build.log

      - name: Show the build log's important lines
        if: always()
        run: |
          grep -E "\[Build\]|error CS|Exception|Build Succeeded|Build Failed" build.log | head -60 || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-log
          path: build.log

      - uses: actions/upload-artifact@v4
        with:
          name: CardboardXR-apk
          path: Builds/CardboardXR.apk
          if-no-files-found: error

      - name: Give the cache back to the runner's user
        if: always()
        run: sudo chown -R "$USER" Library || true
