name: Check Unity licence

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Sign in to Unity and start the editor
        env:
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          docker run --rm -e UNITY_EMAIL -e UNITY_PASSWORD -v "$GITHUB_WORKSPACE":/project \
            unityci/editor:ubuntu-6000.6.0f1-android-3.2.2 \
            bash -c 'unity-editor -batchmode -nographics -quit -username "$UNITY_EMAIL" -password "$UNITY_PASSWORD" -projectPath /project -logFile -' \
            2>&1 | tee check.log | grep -iE "licens|entitle|activation|Exiting batchmode|login|error" | sed "s/$UNITY_EMAIL/***/g" | head -60
